[package]
name = "ferber"
version = "0.2.10"
edition = "2021"
authors = ["notvcto <git@notvc.to>"]
description = "Ferber kernel — capability-based microkernel for RISC-V"
license = "GPL-2.0-only"
repository = "https://github.com/notvcto/ferber"

[dependencies]
bitflags = { version = "2.6", default-features = false }

[features]
# Emulator-only diagnostic port; ordinary hardware builds disable it.
qemu-debug-port = []
# Opt-in verification scenarios; ordinary builds use the resident probes.
cooperative-deadlock-probe = []
userspace-elf-probe = []
minimal-init = []
user-isolation-probe = []
user-write-probe = ["user-isolation-probe"]
user-execute-probe = ["user-isolation-probe"]
x86-exception-probe = ["qemu-debug-port"]

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
