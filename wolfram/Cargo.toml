[package]
name = "wolfram"
version = "0.2.2"
edition = "2021"
authors = ["notvcto <git@notvc.to>"]
description = "Wolfram kernel — capability-based microkernel for RISC-V"
license = "GPL-2.0-only"
repository = "https://github.com/notvcto/wolfram-os"

[dependencies]
bitflags = { version = "2.6", default-features = false }

[features]
# Emulator-only diagnostics. Ordinary firmware and hardware builds disable these.
qemu-debug-port = []
user-isolation-probe = []
user-write-probe = ["user-isolation-probe"]
user-execute-probe = ["user-isolation-probe"]
x86-exception-probe = ["qemu-debug-port"]

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
