name: Wolfram OS

on:
  push:
    branches: [main]
    tags: ['Uranium-*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: riscv64gc-unknown-none-elf,x86_64-unknown-none,x86_64-unknown-uefi
          components: rust-src,llvm-tools-preview,clippy

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-misc qemu-system-x86 ovmf ripgrep

      - name: Build (RISC-V)
        working-directory: wolfram
        run: cargo build --target riscv64gc-unknown-none-elf

      - name: Build (x86-64)
        working-directory: wolfram
        run: cargo build --target x86_64-unknown-none

      - name: Clippy (RISC-V)
        working-directory: wolfram
        run: cargo clippy --target riscv64gc-unknown-none-elf -- -D warnings

      - name: Clippy (x86-64)
        working-directory: wolfram
        run: cargo clippy --target x86_64-unknown-none -- -D warnings

      - name: Clippy (UEFI loader)
        working-directory: boot/uefi
        run: cargo +nightly clippy --release --target x86_64-unknown-uefi -- -D warnings

      - name: Clippy (user probes)
        working-directory: wolfram
        run: |
          cargo clippy --target riscv64gc-unknown-none-elf --features user-isolation-probe -- -D warnings
          cargo clippy --target x86_64-unknown-none --features qemu-debug-port,user-isolation-probe -- -D warnings
          cargo clippy --target x86_64-unknown-none --features x86-exception-probe -- -D warnings

      - name: Check smoke scripts
        run: |
          for script in scripts/riscv-smoke.sh scripts/x86-smoke.sh scripts/x86-preview.sh scripts/smoke-log.sh; do
            bash -n "$script"
          done
          bash scripts/smoke-log.sh --self-test

      - name: Smoke test (RISC-V)
        run: bash scripts/riscv-smoke.sh

      - name: Smoke test (x86-64 UEFI)
        env:
          OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
          OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
        run: bash scripts/x86-smoke.sh

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none,x86_64-unknown-uefi
          components: rust-src,llvm-tools-preview

      - name: Install ISO tools
        run: sudo apt-get update && sudo apt-get install -y xorriso dosfstools mtools

      - name: Build kernel (x86-64)
        working-directory: wolfram
        run: cargo build --release --target x86_64-unknown-none

      - name: Build UEFI bootloader
        working-directory: boot/uefi
        run: cargo +nightly build --release --target x86_64-unknown-uefi

      - name: Build UEFI ISO
        run: |
          set -euo pipefail

          KERNEL=wolfram/target/x86_64-unknown-none/release/wolfram
          LOADER=boot/uefi/target/x86_64-unknown-uefi/release/wolfram-uefi-loader.efi

          # Size FAT32 image to payload + 10 MiB headroom (FAT32 minimum: 33 MiB)
          payload_kb=$(du -sk "$KERNEL" "$LOADER" | awk '{s+=$1} END {print s}')
          img_kb=$(( (payload_kb + 10240 + 511) / 512 * 512 ))
          [ "$img_kb" -lt 33792 ] && img_kb=33792

          iso_work=$(mktemp -d)
          trap 'rm -rf -- "$iso_work"' EXIT

          efi_img="$iso_work/efiboot.img"
          truncate -s "${img_kb}k" "$efi_img"
          mkfs.vfat -F 32 -n WOLFRAM "$efi_img" >/dev/null
          mmd -i "$efi_img" ::/EFI ::/EFI/BOOT
          mcopy -i "$efi_img" "$LOADER" ::/EFI/BOOT/BOOTX64.EFI
          mcopy -i "$efi_img" "$KERNEL" ::/WOLFRAM.ELF

          mkdir -p "$iso_work/iso/EFI/BOOT"
          cp "$efi_img" "$iso_work/iso/EFI/BOOT/efiboot.img"

          xorriso -as mkisofs -R -J -V WOLFRAM \
            -e EFI/BOOT/efiboot.img -no-emul-boot \
            -o wolfram.iso "$iso_work/iso"

          echo "ISO: $(du -sh wolfram.iso | cut -f1)"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          prerelease: true
          files: wolfram.iso
