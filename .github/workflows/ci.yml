name: Ferber OS

on:
  push:
    branches: [main]
    tags: ['Uranium-*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: riscv64imac-unknown-none-elf,riscv64gc-unknown-none-elf,x86_64-unknown-none,x86_64-unknown-uefi
          components: rust-src,llvm-tools-preview,clippy

      - name: Build (RISC-V)
        working-directory: ferber
        run: cargo build --target riscv64gc-unknown-none-elf

      - name: Build (x86-64)
        working-directory: ferber
        run: cargo build --target x86_64-unknown-none

      - name: Clippy (RISC-V)
        working-directory: ferber
        run: cargo clippy --target riscv64gc-unknown-none-elf -- -D warnings

      - name: Clippy (x86-64)
        working-directory: ferber
        run: cargo clippy --target x86_64-unknown-none -- -D warnings

      - name: Clippy (UEFI loader)
        working-directory: boot/uefi
        run: cargo +nightly clippy --release --target x86_64-unknown-uefi -- -D warnings

      - name: Clippy (user probes)
        working-directory: ferber
        run: |
          for feature in service-wake-probe userspace-job-accounting-probe userspace-vmo-seal-probe user-vmo-seal-write-probe userspace-vmo-map-probe user-vmo-map-write-probe user-vmo-map-execute-probe userspace-vmo-probe init user-isolation-probe user-write-probe user-execute-probe cooperative-deadlock-probe; do
            cargo clippy --target riscv64gc-unknown-none-elf --features "$feature" -- -D warnings
            cargo clippy --target x86_64-unknown-none --features "qemu-debug-port,$feature" -- -D warnings
          done
          cargo clippy --target x86_64-unknown-none --features x86-exception-probe -- -D warnings

      - name: Clippy (xHCI handoff profiles)
        run: |
          for feature in xhci-handoff-probe xhci-target-msi; do
            (cd ferber && cargo clippy --target x86_64-unknown-none --features "$feature" -- -D warnings)
            (cd boot/uefi && cargo +nightly clippy --release --target x86_64-unknown-uefi --features "$feature" -- -D warnings)
          done

      - name: Clippy (IOMMU readiness profiles)
        working-directory: ferber
        run: |
          cargo clippy --target x86_64-unknown-none --features iommu-readiness-probe,qemu-debug-port -- -D warnings
          cargo clippy --target x86_64-unknown-none --features iommu-readiness-probe,xhci-target-msi -- -D warnings

      - name: Clippy (QEMU DMA diagnostic)
        working-directory: ferber
        run: |
          for feature in qemu-dma-probe qemu-dma-unmapped qemu-dma-readonly qemu-dma-unmap qemu-dma-production; do
            cargo clippy --target x86_64-unknown-none --features "qemu-debug-port,$feature" -- -D warnings
          done

      - name: Clippy (separately compiled userspace ELF)
        run: |
          for target in riscv64gc-unknown-none-elf x86_64-unknown-none; do
            scripts/build-user-elf.sh "$target" debug
            scripts/build-init-bundle.sh "$target" debug
            scripts/build-user.sh console-echo "$target" debug
            scripts/build-user.sh job-accounting-probe "$target" debug
            scripts/build-user.sh vmo-probe "$target" debug
            scripts/build-user.sh vmo-seal-probe "$target" debug
            scripts/build-user.sh vmo-seal-write "$target" debug
            scripts/build-user.sh vmo-map-probe "$target" debug
            scripts/build-user.sh vmo-map-write "$target" debug
            scripts/build-user.sh vmo-map-execute "$target" debug
            (cd ferber && cargo clippy --target "$target" --features userspace-elf-probe -- -D warnings)
          done

      - name: Check smoke scripts
        run: |
          for script in scripts/riscv-smoke.sh scripts/x86-smoke.sh scripts/x86-preview.sh scripts/smoke-log.sh scripts/build-iso.sh scripts/x86-iso-smoke.sh scripts/memory-tests.sh scripts/channel-tests.sh scripts/build-user-elf.sh scripts/build-user.sh scripts/build-init-test.sh scripts/init-protocol-tests.sh scripts/elf-tests.sh scripts/elf-load-tests.sh scripts/uefi-payload-tests.sh scripts/vmo-core-tests.sh scripts/vmo-syscall-tests.sh scripts/riscv-paging-tests.sh scripts/x86-paging-tests.sh scripts/job-accounting-tests.sh scripts/task-tests.sh scripts/scheduler-tests.sh scripts/boot-bundle-tests.sh scripts/build-init-bundle.sh scripts/initramfs.sh scripts/initramfs-tests.sh scripts/platform-tests.sh scripts/device-tests.sh scripts/iommu-tests.sh scripts/terminal-tests.sh scripts/console-tests.sh scripts/console-client-tests.sh scripts/irq-notification-tests.sh scripts/build-xhci-handoff.sh scripts/xhci-handoff-smoke.sh scripts/xhci-handoff-tests.sh scripts/build-iommu-probe.sh scripts/build-qemu-dma.sh scripts/iommu-smoke.sh scripts/amdvi-eligibility-tests.sh scripts/build-iommu-readiness.sh scripts/iommu-readiness-smoke.sh scripts/pci-readiness-tests.sh scripts/pci-config-tests.sh; do
            bash -n "$script"
          done
          bash scripts/smoke-log.sh --self-test
          bash scripts/xhci-handoff-smoke.sh --self-test
          bash scripts/iommu-smoke.sh --self-test
          bash scripts/iommu-readiness-smoke.sh --self-test

      - name: Test hierarchical Job allocation accounting
        run: |
          bash scripts/job-accounting-tests.sh
          bash scripts/task-tests.sh
          bash scripts/scheduler-tests.sh
          bash scripts/boot-bundle-tests.sh

      - name: Test console and device foundations
        run: |
          bash scripts/platform-tests.sh
          bash scripts/xhci-handoff-tests.sh
          bash scripts/device-tests.sh
          bash scripts/iommu-tests.sh
          bash scripts/amdvi-eligibility-tests.sh
          bash scripts/pci-readiness-tests.sh
          bash scripts/pci-config-tests.sh
          bash scripts/terminal-tests.sh
          bash scripts/console-tests.sh
          bash scripts/console-client-tests.sh
          bash scripts/irq-notification-tests.sh

      - name: Test initramfs archive, tools and filesystem sessions
        run: bash scripts/initramfs-tests.sh

      - name: Test VMO backing and budgets
        run: |
          bash scripts/vmo-core-tests.sh
          bash scripts/vmo-syscall-tests.sh

      - name: Test production page-table walkers
        run: |
          bash scripts/riscv-paging-tests.sh
          bash scripts/x86-paging-tests.sh

      - name: Test physical memory models
        run: bash scripts/memory-tests.sh

      - name: Test channel concurrency and allocation failures
        run: bash scripts/channel-tests.sh

      - name: Test UEFI payload loading and failures
        run: bash scripts/uefi-payload-tests.sh

      - name: Test userspace ELF validation
        run: |
          bash scripts/elf-tests.sh
          bash scripts/elf-load-tests.sh
          bash scripts/init-protocol-tests.sh

  smoke:
    name: Smoke (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [riscv, x86, iso, handoff, iommu, readiness]
    env:
      OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
      OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: riscv64imac-unknown-none-elf,riscv64gc-unknown-none-elf,x86_64-unknown-none,x86_64-unknown-uefi
          components: rust-src,llvm-tools-preview

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system ovmf ripgrep xorriso dosfstools mtools
          qemu-system-riscv64 --version
          qemu-system-x86_64 --version

      - name: Smoke test (RISC-V)
        if: matrix.suite == 'riscv'
        run: bash scripts/riscv-smoke.sh

      - name: Smoke test (x86-64 UEFI)
        if: matrix.suite == 'x86'
        run: bash scripts/x86-smoke.sh

      - name: Smoke test (xHCI handoff diagnostic)
        if: matrix.suite == 'handoff'
        run: bash scripts/xhci-handoff-smoke.sh

      - name: Smoke test (read-only IOMMU readiness)
        if: matrix.suite == 'readiness'
        run: bash scripts/iommu-readiness-smoke.sh

      - name: Install DMA emulator build dependencies
        if: matrix.suite == 'iommu'
        run: sudo apt-get install -y ninja-build meson gcc pkg-config libglib2.0-dev libpixman-1-dev libfdt-dev python3-venv python3-setuptools python3-wheel

      - name: Cache DMA test emulator
        if: matrix.suite == 'iommu'
        uses: actions/cache@v4
        with:
          path: target/qemu-dma/11.1.3
          key: ${{ runner.os }}-${{ runner.arch }}-qemu-dma-11.1.3-fault-bitpos-v1

      - name: Smoke test (QEMU DMA isolation)
        if: matrix.suite == 'iommu'
        run: |
          QEMU_X86=$(bash scripts/build-qemu-dma.sh)
          export QEMU_X86
          bash scripts/iommu-smoke.sh

      - name: Smoke test (x86-64 release ISO)
        if: matrix.suite == 'iso'
        run: |
          bash scripts/x86-iso-smoke.sh
          bash scripts/x86-iso-smoke.sh elf
          bash scripts/x86-iso-smoke.sh init
          bash scripts/x86-iso-smoke.sh service-wake
          bash scripts/x86-iso-smoke.sh vmo
          bash scripts/x86-iso-smoke.sh vmo-map
          bash scripts/x86-iso-smoke.sh vmo-seal
          bash scripts/x86-iso-smoke.sh accounting

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [check, smoke]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none,x86_64-unknown-uefi
          components: rust-src,llvm-tools-preview

      - name: Install ISO tools
        run: sudo apt-get update && sudo apt-get install -y xorriso dosfstools mtools

      - name: Build kernel (x86-64)
        working-directory: ferber
        run: |
          cargo build --release --target x86_64-unknown-none --features init

      - name: Build UEFI bootloader
        working-directory: boot/uefi
        run: cargo +nightly build --release --target x86_64-unknown-uefi

      - name: Build UEFI ISO
        run: |
          image=$(scripts/build-init-bundle.sh x86_64-unknown-none release)
          bash scripts/build-iso.sh \
            ferber/target/x86_64-unknown-none/release/ferber \
            boot/uefi/target/x86_64-unknown-uefi/release/ferber-uefi-loader.efi \
            ferber.iso "$image"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          prerelease: true
          files: ferber.iso

      - name: Remove legacy Wolfram ISO asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.id')
          asset_id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --jq '.[] | select(.name == "wolfram.iso") | .id')
          if [ -n "$asset_id" ]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          fi
